<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heading scale interpolation</title>
</head>
<body>
<p>h1 = 2.625rem, h6 = 1rem. Pick an easing to interpolate h2–h5. size(i) = 2.625 − 1.625·e(i/5), i = 0…5.</p>

<h1>lorem ipsum</h1>
<h2>lorem ipsum</h2>
<h3>lorem ipsum</h3>
<h4>lorem ipsum</h4>
<h5>lorem ipsum</h5>
<h6>lorem ipsum</h6>

<p id="controls"></p>

<p>Active easing: <strong id="active"></strong> — <span id="cb"></span></p>

<table border="1" cellpadding="6">
  <thead>
    <tr><th>Heading</th><th>% diff to previous</th><th>font size (rem)</th></tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
  const H1 = 2.625, H6 = 1.000, N = 5;

  const easings = {
    linear:       { cb: "cubic-bezier(0,0,1,1)",          fn: t => t },
    easeOutSine:  { cb: "cubic-bezier(0.61,1,0.88,1)",    fn: t => Math.sin((t * Math.PI) / 2) },
    easeOutQuad:  { cb: "cubic-bezier(0.5,1,0.89,1)",     fn: t => 1 - (1 - t) ** 2 },
    easeOutCubic: { cb: "cubic-bezier(0.33,1,0.68,1)",    fn: t => 1 - (1 - t) ** 3 },
    easeOutQuart: { cb: "cubic-bezier(0.25,1,0.5,1)",     fn: t => 1 - (1 - t) ** 4 },
    easeOutExpo:  { cb: "cubic-bezier(0.16,1,0.3,1)",     fn: t => t === 1 ? 1 : 1 - 2 ** (-10 * t) },
    easeInOutCubic:{cb: "cubic-bezier(0.65,0,0.35,1)",    fn: t => t < 0.5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2 },
  };
  const order = Object.keys(easings);

  const sizeAt = (key, i) => H1 + (H6 - H1) * easings[key].fn(i / N);
  const headings = [...document.querySelectorAll("h1,h2,h3,h4,h5,h6")];
  const tbody = document.getElementById("tbody");
  const fmtPct = v => (v >= 0 ? "+" : "\u2212") + Math.abs(v).toFixed(2) + "%";

  function apply(key) {
    headings.forEach((h, i) => { h.style.fontSize = sizeAt(key, i).toFixed(3) + "rem"; });
    document.getElementById("active").textContent = key;
    document.getElementById("cb").textContent = easings[key].cb;
    tbody.innerHTML = "";
    for (let i = 0; i <= N; i++) {
      const s = sizeAt(key, i);
      const pct = i === 0 ? "\u2014" : fmtPct((s - sizeAt(key, i - 1)) / sizeAt(key, i - 1) * 100);
      tbody.insertAdjacentHTML("beforeend",
        `<tr><td>h${i + 1}</td><td>${pct}</td><td>${s.toFixed(3)}</td></tr>`);
    }
  }

  const controls = document.getElementById("controls");
  order.forEach(key => {
    const b = document.createElement("button");
    b.textContent = key;
    b.onclick = () => apply(key);
    controls.appendChild(b);
    controls.appendChild(document.createTextNode(" "));
  });

  apply("linear");

  console.assert(Math.abs(sizeAt("linear", 0) - 2.625) < 1e-9, "h1=2.625");
  console.assert(Math.abs(sizeAt("easeOutExpo", 5) - 1.000) < 1e-9, "h6=1.000");
</script>
</body>
</html>
